name: VirgoScorpio Hub CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: virgoscorpio_hub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-security-and-dependencies:
    name: Unit, security, and dependency checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.23.4", "24.22.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Pin npm CLI for reproducible dependency and SBOM evidence
        run: |
          expected_npm="$(node -p "require('./package.json').packageManager")"
          npm install --global "$expected_npm"
          expected_version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          test "$(npm --version)" = "$expected_version"
      - name: Install exact reviewed dependency graph (requires committed package-lock.json)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Materialize optional local assets
        run: npm run postinstall
      - name: Syntax, artifact, and unit tests
        run: npm run check
      - name: Dependency audit
        run: |
          set -o pipefail
          mkdir -p artifacts/evidence
          printf 'Node.js: '; node --version
          printf 'npm: '; npm --version
          npm audit --audit-level=high 2>&1 | tee artifacts/evidence/npm-audit-all.log
          npm audit --omit=dev --audit-level=high 2>&1 | tee artifacts/evidence/npm-audit.log
      - name: Generate CycloneDX SBOM
        run: npm run sbom
      - name: Generate fail-closed release-readiness snapshot
        run: npm run release:readiness
      - name: Upload release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: virgoscorpio_hub-dependency-evidence-node-${{ matrix.node-version }}
          path: |
            artifacts/virgoscorpio-hub.sbom.cdx.json
            artifacts/release-readiness.json
            artifacts/release-readiness.md
            artifacts/evidence/*.log
            package-lock.json
          if-no-files-found: error
      - name: Stage revision-bound dependency evidence
        if: always()
        env:
          VIRGOSCORPIO_HUB_CI_JOB_KEY: node-${{ matrix.node-version }}
          VIRGOSCORPIO_HUB_CI_JOB_NAME: Unit, security, and dependency checks (Node ${{ matrix.node-version }})
          VIRGOSCORPIO_HUB_CI_RUNTIME: v${{ matrix.node-version }}
          VIRGOSCORPIO_HUB_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-evidence.js stage
      - name: Upload revision-bound dependency evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: virgoscorpio_hub-ci-evidence-node-${{ matrix.node-version }}
          overwrite: true
          path: artifacts/ci-evidence-stage/
          if-no-files-found: warn

  postgres-memgraph-integration:
    name: PostgreSQL and Memgraph integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: virgoscorpio_hub
          POSTGRES_USER: virgoscorpio_hub
          POSTGRES_PASSWORD: virgoscorpio_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U virgoscorpio_hub -d virgoscorpio_hub"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      memgraph:
        image: memgraph/memgraph:3.13.1
        ports:
          - 7687:7687
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://virgoscorpio_hub:virgoscorpio_hub_test@127.0.0.1:5432/virgoscorpio_hub
      TEST_DATABASE_URL: postgres://virgoscorpio_hub:virgoscorpio_hub_test@127.0.0.1:5432/virgoscorpio_hub_test
      MEMGRAPH_URL: bolt://127.0.0.1:7687
      MEMGRAPH_TEST_URL: bolt://127.0.0.1:7687
      MEMGRAPH_TEST_STATIC_PORT: "true"
      VIRGOSCORPIO_HUB_PRESENCE_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - name: Install exact reviewed dependency graph (requires committed package-lock.json)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Create isolated integration database
        env:
          PGPASSWORD: virgoscorpio_hub_test
        run: psql -h 127.0.0.1 -U virgoscorpio_hub -d virgoscorpio_hub -v ON_ERROR_STOP=1 -c "CREATE DATABASE virgoscorpio_hub_test;"
      - name: Wait for Memgraph Bolt listener
        run: |
          for attempt in $(seq 1 60); do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/7687' 2>/dev/null; then exit 0; fi
            sleep 2
          done
          echo 'Memgraph did not become ready on Bolt port 7687.' >&2
          exit 1
      - name: Identify the exact Memgraph test container
        shell: bash
        run: |
          mapfile -t ids < <(
            docker ps \
              --filter 'ancestor=memgraph/memgraph:3.13.1' \
              --format '{{.ID}}'
          )

          if [ "${#ids[@]}" -ne 1 ]; then
            echo "Expected exactly one Memgraph service container; found ${#ids[@]}." >&2
            docker ps --format '{{.ID}} {{.Image}} {{.Names}}'
            exit 1
          fi

          image="$(docker inspect --format '{{.Config.Image}}' "${ids[0]}")"

          if [ "$image" != 'memgraph/memgraph:3.13.1' ]; then
            echo "Unexpected Memgraph test image: $image" >&2
            exit 1
          fi

          echo "MEMGRAPH_TEST_CONTAINER_ID=${ids[0]}" >> "$GITHUB_ENV"
      - name: Identify exact disposable Redis integration container
        shell: bash
        run: |
          mapfile -t ids < <(
            docker ps --no-trunc \
              --filter 'ancestor=redis:7.4-alpine' \
              --format '{{.ID}}'
          )

          if [ "${#ids[@]}" -ne 1 ]; then
            echo "Expected exactly one Redis 7.4 test service container; found ${#ids[@]}." >&2
            docker ps --format '{{.ID}} {{.Image}} {{.Names}}'
            exit 1
          fi

          id="${ids[0]}"
          metadata="$(docker inspect --format '{{.Id}}|{{.Config.Image}}|{{.State.Running}}' "$id")"
          IFS='|' read -r full_id image running <<< "$metadata"

          if [ "$full_id" != "$id" ] || [ "$image" != 'redis:7.4-alpine' ] || [ "$running" != 'true' ]; then
            echo 'Redis service identity/image/state did not match the approved disposable test target.' >&2
            exit 1
          fi

          echo "VIRGOSCORPIO_HUB_TEST_REDIS_CONTAINER_ID=$id" >> "$GITHUB_ENV"
      - name: Apply all migrations to a disposable fresh PostgreSQL database and verify idempotency
        run: npm run test:migrations:fresh
      - name: Test PostgreSQL/Memgraph/community/commerce and real Redis outage/recovery integration workflows (zero skips required)
        env:
          VIRGOSCORPIO_HUB_RUN_REDIS_OUTAGE_INTEGRATION: "true"
        run: npm run test:integration:live
      - name: Install Chromium for PostgreSQL-backed collaboration browser qualification
        # Download the browser binary without invoking Playwright's apt-based OS dependency installer.
        # The --with-deps path failed when Ubuntu mirror DNS was unavailable; the following tests verify browser startup.
        run: npx playwright install chromium
      - name: Verify PostgreSQL-backed multi-node collaboration and real Redis-outage authorization fallback
        env:
          VIRGOSCORPIO_HUB_RUN_POSTGRES_INTEGRATION: "true"
          VIRGOSCORPIO_HUB_TEST_REDIS_URL: redis://127.0.0.1:6379
          VIRGOSCORPIO_HUB_RUN_REDIS_OUTAGE_AUTHORIZATION: "true"
        run: npm run test:e2e:collaboration:postgres
      - name: Upload PostgreSQL collaboration Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: virgoscorpio_hub-postgres-collaboration-playwright
          path: test-results/
          if-no-files-found: ignore
      - name: Restore disposable Redis service after outage qualification
        if: always() && env.VIRGOSCORPIO_HUB_TEST_REDIS_CONTAINER_ID != ''
        shell: bash
        run: |
          id="${VIRGOSCORPIO_HUB_TEST_REDIS_CONTAINER_ID:-}"
          if [[ ! "$id" =~ ^[a-fA-F0-9]{64}$ ]]; then
            echo 'Missing or invalid exact Redis test container ID; refusing any container-wide recovery action.' >&2
            exit 1
          fi

          metadata="$(docker inspect --format '{{.Id}}|{{.Config.Image}}|{{.State.Running}}' "$id")"
          IFS='|' read -r full_id image running <<< "$metadata"
          if [[ "$full_id" != "$id" || "$image" != 'redis:7.4-alpine' ]]; then
            echo 'Redis recovery target identity/image mismatch; refusing to start it.' >&2
            exit 1
          fi

          if [[ "$running" != 'true' ]]; then
            docker start "$id"
          fi

          final_state="$(docker inspect --format '{{.State.Running}}' "$id")"
          if [[ "$final_state" != 'true' ]]; then
            echo 'The approved Redis test service did not return to running state.' >&2
            exit 1
          fi
      - name: Exercise real Memgraph outage and outbox recovery
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/evidence
          npm run test:integration:memgraph-outage 2>&1 | tee artifacts/evidence/memgraph-outage-live.log
      - name: Validate canonical graph rebuild in an isolated Memgraph container
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/evidence
          npm run test:graph:rebuild 2>&1 | tee artifacts/evidence/graph-rebuild-live.log
      - name: Upload live integration test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: virgoscorpio_hub-live-integration-node-22.23.4
          path: |
            artifacts/evidence/integration-tests.tap.log
            artifacts/evidence/integration-migrations.log
            artifacts/evidence/integration-live.json
            artifacts/evidence/fresh-migrations.json
            artifacts/evidence/fresh-migrations.log
            artifacts/evidence/memgraph-outage-live.log
            artifacts/evidence/graph-rebuild-live.log
          if-no-files-found: warn
      - name: Stage revision-bound live database evidence
        if: always()
        env:
          VIRGOSCORPIO_HUB_CI_JOB_KEY: postgres-memgraph-integration
          VIRGOSCORPIO_HUB_CI_JOB_NAME: PostgreSQL and Memgraph integration
          VIRGOSCORPIO_HUB_CI_RUNTIME: v22.23.4
          VIRGOSCORPIO_HUB_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-evidence.js stage
      - name: Upload revision-bound live database evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: virgoscorpio_hub-ci-evidence-postgres-memgraph-integration
          overwrite: true
          path: artifacts/ci-evidence-stage/
          if-no-files-found: warn

  browser-and-accessibility:
    name: Browser editor and accessibility smoke tests
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      VIRGOSCORPIO_HUB_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - name: Install exact reviewed dependency graph (requires committed package-lock.json)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Materialize optional local assets
        run: npm run postinstall
      - name: Install Chromium
        # Download the browser binary without invoking Playwright's apt-based OS dependency installer.
        # The --with-deps path failed when Ubuntu mirror DNS was unavailable; the following tests verify browser startup.
        run: npx playwright install chromium
      - name: Exercise visual editor and accessibility smoke tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/evidence
          npm run test:e2e 2>&1 | tee artifacts/evidence/browser-smoke.log
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: virgoscorpio_hub-playwright-report
          path: test-results/
          if-no-files-found: ignore
      - name: Stage revision-bound browser evidence
        if: always()
        env:
          VIRGOSCORPIO_HUB_CI_JOB_KEY: browser-and-accessibility
          VIRGOSCORPIO_HUB_CI_JOB_NAME: Browser editor and accessibility smoke tests
          VIRGOSCORPIO_HUB_CI_RUNTIME: v22.23.4
          VIRGOSCORPIO_HUB_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-evidence.js stage
      - name: Upload revision-bound browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: virgoscorpio_hub-ci-evidence-browser-and-accessibility
          overwrite: true
          path: artifacts/ci-evidence-stage/
          if-no-files-found: warn

  security-static-analysis:
    name: CodeQL security analysis
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - name: Stage revision-bound CodeQL evidence
        if: always()
        env:
          VIRGOSCORPIO_HUB_CI_JOB_KEY: security-static-analysis
          VIRGOSCORPIO_HUB_CI_JOB_NAME: CodeQL security analysis
          VIRGOSCORPIO_HUB_CI_RUNTIME: not-applicable
          VIRGOSCORPIO_HUB_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-evidence.js stage
      - name: Upload revision-bound CodeQL evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: virgoscorpio_hub-ci-evidence-security-static-analysis
          overwrite: true
          path: artifacts/ci-evidence-stage/
          if-no-files-found: warn

  attest-supply-chain:
    name: Attest dependency lockfile and SBOM
    needs:
      - unit-security-and-dependencies
    if: >-
      needs.unit-security-and-dependencies.result == 'success' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the Node.js 22 dependency evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: virgoscorpio_hub-dependency-evidence-node-22.23.4
          path: supply-chain
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - name: Verify lockfile and CycloneDX SBOM identity
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { createHash } = require('node:crypto');

          const lockPath = path.join('supply-chain', 'package-lock.json');
          const sbomPath = path.join('supply-chain', 'artifacts', 'virgoscorpio-hub.sbom.cdx.json');
          const logPath = path.join('supply-chain', 'artifacts', 'evidence', 'sbom-generation.log');
          const lockBytes = fs.readFileSync(lockPath);
          const sbomBytes = fs.readFileSync(sbomPath);
          const lock = JSON.parse(lockBytes.toString('utf8'));
          const bom = JSON.parse(sbomBytes.toString('utf8'));
          const log = fs.readFileSync(logPath, 'utf8');
          const root = lock.packages && lock.packages[''];
          const component = bom.metadata && bom.metadata.component;
          const sha256 = (bytes) => createHash('sha256').update(bytes).digest('hex');

          if (!root || root.name !== 'virgoscorpio-hub' || root.version !== '0.6.2') {
            throw new Error('Downloaded package-lock root identity does not match VirgoScorpio Hub 0.6.2.');
          }
          if (bom.bomFormat !== 'CycloneDX' || bom.specVersion !== '1.5' || !Array.isArray(bom.components) || !Array.isArray(bom.dependencies)) {
            throw new Error('Downloaded SBOM is not a valid CycloneDX 1.5 component/dependency document.');
          }
          if (!component || component.purl !== 'pkg:npm/virgoscorpio-hub@0.6.2' || component.version !== '0.6.2') {
            throw new Error('SBOM root identity does not match the reviewed package-lock.');
          }
          if (!log.includes('package-lock.json SHA-256: ' + sha256(lockBytes)) ||
              !log.includes('virgoscorpio-hub.sbom.cdx.json SHA-256: ' + sha256(sbomBytes))) {
            throw new Error('SBOM generation log does not bind the downloaded lockfile and SBOM digests.');
          }
          process.stdout.write(JSON.stringify({
            package: root.name + '@' + root.version,
            lockfileSha256: sha256(lockBytes),
            sbomSha256: sha256(sbomBytes),
            sbomComponents: bom.components.length,
            sbomDependencyRecords: bom.dependencies.length
          }, null, 2) + String.fromCharCode(10));
          NODE
      - name: Create SLSA build provenance for lockfile and SBOM
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            supply-chain/package-lock.json
            supply-chain/artifacts/virgoscorpio-hub.sbom.cdx.json
          create-storage-record: false
      - name: Create signed SBOM attestation for the dependency lockfile
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: supply-chain/package-lock.json
          sbom-path: supply-chain/artifacts/virgoscorpio-hub.sbom.cdx.json
          create-storage-record: false
      - name: Stage attestation bundles
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$PROVENANCE_BUNDLE"
          test -s "$SBOM_BUNDLE"
          mkdir -p artifacts/evidence/supply-chain-attestations
          cp "$PROVENANCE_BUNDLE" artifacts/evidence/supply-chain-attestations/slsa-provenance.json
          cp "$SBOM_BUNDLE" artifacts/evidence/supply-chain-attestations/sbom-attestation.json
      - name: Install checksum-pinned GitHub CLI for attestation verification
        env:
          GH_VERSION: 2.103.3
          GH_ARCHIVE_SHA256: 4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d
        run: |
          set -euo pipefail
          archive="gh_${GH_VERSION}_linux_amd64.tar.gz"
          archive_path="$RUNNER_TEMP/$archive"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/${archive}" \
            --output "$archive_path"
          printf '%s  %s\n' "$GH_ARCHIVE_SHA256" "$archive_path" | sha256sum --check --strict
          tar -xzf "$archive_path" -C "$RUNNER_TEMP"
          gh_bin="$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin"
          test -x "$gh_bin/gh"
          echo "$gh_bin" >> "$GITHUB_PATH"
          test "$( "$gh_bin/gh" version | awk 'NR == 1 { print $3 }' )" = "$GH_VERSION"
          "$gh_bin/gh" version

      - name: Verify signed supply-chain attestations and record exact digests
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
          LOCKFILE: supply-chain/package-lock.json
          SBOM_FILE: supply-chain/artifacts/virgoscorpio-hub.sbom.cdx.json
        run: |
          set -euo pipefail
          command -v gh
          gh version
          gh attestation verify "$LOCKFILE" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$PROVENANCE_BUNDLE" \
            --cert-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main" \
            --deny-self-hosted-runners \
            --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA" \
            --format json \
            > artifacts/evidence/supply-chain-attestations/provenance-lockfile-verification.json
          gh attestation verify "$SBOM_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$PROVENANCE_BUNDLE" \
            --cert-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main" \
            --deny-self-hosted-runners \
            --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA" \
            --format json \
            > artifacts/evidence/supply-chain-attestations/provenance-sbom-verification.json
          gh attestation verify "$LOCKFILE" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$SBOM_BUNDLE" \
            --cert-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main" \
            --deny-self-hosted-runners \
            --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA" \
            --predicate-type https://cyclonedx.org/bom \
            --format json \
            > artifacts/evidence/supply-chain-attestations/sbom-verification.json
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const readJson = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const sha256 = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const stable = (value) => Array.isArray(value)
            ? '[' + value.map(stable).join(',') + ']'
            : value && typeof value === 'object'
              ? '{' + Object.keys(value).sort().map((key) => JSON.stringify(key) + ':' + stable(value[key])).join(',') + '}'
              : JSON.stringify(value);
          const lockPath = process.env.LOCKFILE;
          const sbomPath = process.env.SBOM_FILE;
          const lockHash = sha256(lockPath);
          const sbomHash = sha256(sbomPath);
          const provenanceLock = readJson('artifacts/evidence/supply-chain-attestations/provenance-lockfile-verification.json');
          const provenanceSbom = readJson('artifacts/evidence/supply-chain-attestations/provenance-sbom-verification.json');
          const sbomAttestation = readJson('artifacts/evidence/supply-chain-attestations/sbom-verification.json');
          const hasSubject = (results, digest) => Array.isArray(results) && results.some((result) =>
            result.verificationResult?.statement?.subject?.some((subject) => subject.digest?.sha256 === digest)
          );
          if (!hasSubject(provenanceLock, lockHash)) throw new Error('Verified provenance did not bind the exact package-lock.json bytes.');
          if (!hasSubject(provenanceSbom, sbomHash)) throw new Error('Verified provenance did not bind the exact CycloneDX SBOM bytes.');
          const sbomResult = Array.isArray(sbomAttestation) && sbomAttestation.find((result) =>
            result.verificationResult?.statement?.predicateType === 'https://cyclonedx.org/bom'
          );
          if (!sbomResult) throw new Error('A valid CycloneDX SBOM attestation was not returned.');
          const verifiedPredicate = sbomResult.verificationResult.statement.predicate;
          const generatedSbom = readJson(sbomPath);
          if (stable(verifiedPredicate) !== stable(generatedSbom)) {
            throw new Error('Signed CycloneDX predicate does not match the exact generated SBOM document.');
          }
          const summary = {
            repository: process.env.GITHUB_REPOSITORY,
            workflow: '.github/workflows/ci.yml',
            sourceRef: 'refs/heads/main',
            sourceRevision: process.env.GITHUB_SHA,
            package: 'virgoscorpio-hub@0.6.2',
            lockfileSha256: lockHash,
            sbomSha256: sbomHash,
            provenanceSubjectsVerified: ['package-lock.json', 'virgoscorpio-hub.sbom.cdx.json'],
            sbomPredicateType: 'https://cyclonedx.org/bom',
            sbomPredicateMatchesGeneratedFile: true
          };
          fs.writeFileSync(
            'artifacts/evidence/supply-chain-attestations/verification-summary.json',
            JSON.stringify(summary, null, 2) + String.fromCharCode(10),
            { flag: 'wx' }
          );
          process.stdout.write(JSON.stringify(summary, null, 2) + String.fromCharCode(10));
          NODE
      - name: Upload signed supply-chain attestations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: virgoscorpio_hub-supply-chain-attestations
          path: artifacts/evidence/supply-chain-attestations/
          if-no-files-found: error

  aggregate-release-evidence:
    name: Consolidate candidate CI evidence
    if: always()
    needs:
      - unit-security-and-dependencies
      - postgres-memgraph-integration
      - browser-and-accessibility
      - security-static-analysis
      - attest-supply-chain
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - name: Require signed dependency attestations on mainline runs
        env:
          ATTESTATION_JOB_RESULT: ${{ needs.attest-supply-chain.result }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          if [[ "$REF_NAME" == "refs/heads/main" && "$EVENT_NAME" != "pull_request" ]]; then
            if [[ "$ATTESTATION_JOB_RESULT" != "success" ]]; then
              echo "Mainline evidence requires successful signed lockfile/SBOM attestations." >&2
              exit 1
            fi
          fi
      - name: Download this run's revision-bound evidence
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: virgoscorpio_hub-ci-evidence-*
          path: artifacts/ci-evidence
          merge-multiple: false
      - name: Verify workflow jobs, revisions and evidence checksums
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          VIRGOSCORPIO_HUB_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-evidence.js aggregate
      - name: Upload consolidated CI evidence report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: virgoscorpio_hub-release-readiness-ci
          overwrite: true
          path: |
            artifacts/release-readiness-ci.json
            artifacts/release-readiness-ci.md
            artifacts/evidence/postgres-memgraph/integration-live.json
            artifacts/evidence/postgres-memgraph/integration-tests.tap.log
            artifacts/evidence/postgres-memgraph/integration-migrations.log
            artifacts/evidence/postgres-memgraph/fresh-migrations.json
            artifacts/evidence/postgres-memgraph/fresh-migrations.log
            artifacts/evidence/postgres-memgraph/memgraph-outage-live.log
            artifacts/evidence/postgres-memgraph/graph-rebuild-live.log
            artifacts/evidence/postgres-memgraph-live.json
            artifacts/evidence/postgres-memgraph-ci-manifest.json
          if-no-files-found: warn
